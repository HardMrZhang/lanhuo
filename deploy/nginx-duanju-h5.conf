# Nginx 前置（EC2 上 /etc/nginx/conf.d/duanju-h5.conf）：80 跳 443 + 反代 3001
# 证书：sudo dnf install -y certbot python3-certbot-nginx && sudo certbot --nginx -d <你的域名>
# 注意：/s3-hls/*.ts 走服务端中转，proxy 缓存只给免费集；付费集 Cache-Control: private, no-store，
# nginx 必须 respect 上游 Cache-Control（下面已用 $upstream_cache_control 做条件缓存），否则会员会被串用。
upstream duanju_node {
  server 127.0.0.1:3001;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name your-domain.example;

  # certbot 会自动填 ssl_certificate / ssl_certificate_key

  # 前端静态与 API 同源（支付要求同源，防跨站）
  location / {
    proxy_pass http://duanju_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # HLS 分片：只缓存上游标记为 public 的（免费集）；付费集 no-store 不进缓存
  proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls:50m max_size=5g inactive=7d use_temp_path=off;
  location ~* ^/s3-hls/.*\.(ts|m4s)$ {
    proxy_pass http://duanju_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache hls;
    proxy_cache_valid 200 7d;
    # 上游说 private/no-store 就不缓存（付费集），避免会员串用
    proxy_no_cache $upstream_http_cache_control;
    proxy_cache_bypass $upstream_http_cache_control;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Set-Cookie;
  }

  client_max_body_size 32k;
}

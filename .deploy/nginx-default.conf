# Admin 反代同源修复：nginx 必须把真实站点域名透传给后端。
#
# 背景：后台接口有跨站请求防护（requireSameOrigin），它比对浏览器的 Origin
# 与请求的 Host 头。nginx 默认把 Host 改写成上游地址（127.0.0.1:3001），
# 于是同源请求会被误判成跨站 → 登录直接 403「不允许跨站请求」。
#
# 修复要点（两个 location 都要加）：
#   proxy_set_header Host              $host;            真实域名
#   proxy_set_header X-Forwarded-Host  $host;            真实域名（兼容旧逻辑）
#   proxy_set_header X-Forwarded-Proto $scheme;          原始协议
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Real-IP         $remote_addr;
#
# 改了这份配置后必须 nginx -t 再 reload。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lanhuo.peaktvb.org;

    ssl_certificate     /etc/nginx/ssl/lanhuo.peaktvb.org_nginx/lanhuo.peaktvb.org_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/lanhuo.peaktvb.org_nginx/lanhuo.peaktvb.org.key;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

server {
	listen 80 ;
	listen [::]:80;

	# SSL configuration
	#
	# listen 443 ssl default_server;
	# listen [::]:443 ssl default_server;
	#
	# Note: You should disable gzip for SSL traffic.
	# See: https://bugs.debian.org/773782
	#
	# Read up on ssl_certificates in the "Certificates" section of the Nginx docs.
	#
	# This file should only contain directives that are actually used.
	# Remove this comment if you are not using the included files.

	# Add index.php to the list if you are using a PHP
	#
	#location ~ \.php$ {
	#	fastcgi_pass unix:/run/php/php7.4-fpm.sock;
	#	fastcgi_index index.php;
	#	include fastcgi_params;
	#}
	#
	# deny access to .htaccess files, if Apache's document root
	# concurs with nginx's one
	#
	#location ~ /\.ht {
	#	deny all;
	#}

	server_name peaktvb.org www.peaktvb.org lanhuo.peaktvb.org;

	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		proxy_pass http://127.0.0.1:3001;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Forwarded-Host  $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header Upgrade           $http_upgrade;
		proxy_set_header Connection        "upgrade";
	}
}

